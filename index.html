<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>面试专家</title>
<meta http-equiv="refresh" content="4;url=https://a1bb3b6066bf43ba2.app.workbuddy.host/portal">
<style>
:root{--bg:#faf7f2;--ink:#2b2724;--sub:#8b8378;--green:#5f7f6a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.box{text-align:center;max-width:320px}
.logo{width:52px;height:52px;border-radius:15px;margin:0 auto 18px;
  background:linear-gradient(135deg,#6d9077,#3f5b47);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:23px;font-weight:700;letter-spacing:-1px;
  box-shadow:0 8px 24px rgba(63,91,71,.22)}
h1{margin:0 0 8px;font-size:19px;font-weight:600;letter-spacing:-.3px}
p{margin:0;font-size:13.5px;color:var(--sub);line-height:1.7}
.bar{width:118px;height:3px;border-radius:3px;background:#e8e1d6;margin:22px auto 0;overflow:hidden}
.bar i{display:block;width:38%;height:100%;border-radius:3px;background:var(--green);
  animation:run 1.05s ease-in-out infinite}
@keyframes run{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
a{display:none;margin-top:22px;color:var(--green);font-size:13.5px;text-decoration:none;
  border-bottom:1px solid rgba(95,127,106,.35);padding-bottom:2px}
a.on{display:inline-block}
</style>
</head>
<body>
<div class="box">
  <div class="logo">面</div>
  <h1>面试专家</h1>
  <p>正在进入考场…</p>
  <div class="bar"><i></i></div>
  <a id="fb" href="https://a1bb3b6066bf43ba2.app.workbuddy.host/portal">没反应？点这里进入</a>
</div>
<script>
/* 查询串一起带过去：?code=同步码 用来把任意设备接到同一份记忆，丢了它就白点 */
var T = "https://a1bb3b6066bf43ba2.app.workbuddy.host/portal" + location.search + location.hash;
setTimeout(function () {
  var fb = document.getElementById('fb');
  if (fb) { fb.className = 'on'; fb.href = T; }
}, 1300);
try { var _a = document.getElementById('fb'); if (_a) _a.href = T; } catch (e) {}
try { location.replace(T); } catch (e) { location.href = T; }
</script>
</body>
</html>
